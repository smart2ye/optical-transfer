<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>الناقل البصري</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;direction:ltr}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b0f19;color:#e0e6f0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
        .container{max-width:480px;width:100%;background:#141b2b;border-radius:32px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.6);border:1px solid #2a3650}
        h1{font-size:22px;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,#58c4ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sub{text-align:center;color:#7b8aa6;font-size:13px;margin-bottom:24px;border-bottom:1px dashed #253040;padding-bottom:16px}
        .mode-tabs{display:flex;gap:10px;margin-bottom:20px;background:#0f1625;padding:6px;border-radius:60px}
        .mode-tabs button{flex:1;padding:10px;border:none;border-radius:40px;font-weight:700;font-size:15px;cursor:pointer;background:transparent;color:#8899bb;transition:.2s}
        .mode-tabs button.active{background:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.4)}
        .panel{display:none;flex-direction:column;gap:18px}
        .panel.active{display:flex}
        .drop-zone{border:2px dashed #2a3a55;padding:30px 10px;border-radius:20px;text-align:center;color:#7b8aa6;cursor:pointer;transition:.3s;background:#0f1625}
        .drop-zone:hover{border-color:#58c4ff;background:#182133}
        #fileInput{display:none}
        .qr-box{background:#fff;padding:16px;border-radius:20px;display:flex;justify-content:center;align-items:center;min-height:220px;background:#0f1625;border:1px solid #253040}
        #qrcode{width:200px;height:200px;display:flex;justify-content:center;align-items:center}
        #qrcode img,#qrcode canvas{width:100%!important;height:100%!important;border-radius:12px}
        .progress-section{display:flex;flex-direction:column;gap:6px}
        progress{width:100%;height:10px;border-radius:20px;overflow:hidden;-webkit-appearance:none;appearance:none;background:#1f2a3f}
        progress::-webkit-progress-bar{background:#1f2a3f}
        progress::-webkit-progress-value{background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:20px}
        .info-text{display:flex;justify-content:space-between;font-size:13px;color:#a0b3d0}
        .controls{display:flex;gap:12px;flex-wrap:wrap}
        .controls button{flex:1;padding:12px;border:none;border-radius:40px;font-weight:700;background:#1f2a3f;color:#c0d0e8;cursor:pointer;transition:.2s;min-width:80px}
        .controls button.primary{background:#2563eb;color:#fff}
        .controls button.primary:hover{background:#3b82f6}
        .controls button:disabled{opacity:.3;pointer-events:none}
        .camera-box{background:#0a0f1a;border-radius:20px;overflow:hidden;border:1px solid #253040;position:relative;min-height:200px}
        #video{width:100%;display:block;transform:scaleX(-1)}
        #canvas{display:none}
        .log-box{background:#0a0f1a;border-radius:16px;padding:12px;max-height:120px;overflow-y:auto;font-family:monospace;font-size:12px;color:#7aadff;border:1px solid #1a2538;line-height:1.6}
        .log-box span{display:block;border-bottom:1px solid #141d2e;padding:2px 0}
        .status-badge{background:#1a2538;padding:4px 14px;border-radius:40px;font-size:12px;color:#90a8d0;text-align:center}
        .btn-download{background:#10b981;color:#fff;border:none;padding:12px;border-radius:40px;font-weight:bold;width:100%;cursor:pointer}
        .btn-download:hover{background:#34d399}
        .hidden{display:none!important}
    </style>
</head>
<body>
<div class="container">
    <h1>📡 الناقل البصري</h1>
    <div class="sub">أسرع من QR العادي • ضد فقدان الإطارات</div>
    <div class="mode-tabs">
        <button id="tabSender" class="active" onclick="setMode('sender')">📤 إرسال</button>
        <button id="tabReceiver" onclick="setMode('receiver')">📥 استقبال</button>
    </div>
    <div id="panelSender" class="panel active">
        <div class="drop-zone" id="dropZone" onclick="pickFile()">
            <span id="fileName">📂 اضغط لاختيار ملف</span>
            <input type="file" id="fileInput" style="display:none">
        </div>
        <div class="qr-box"><div id="qrcode">📱 QR سيظهر هنا</div></div>
        <div class="progress-section">
            <div class="info-text"><span id="chunkStatus">0 / 0</span><span id="speedStatus">جاهز</span></div>
            <progress id="progressBar" value="0" max="100"></progress>
        </div>
        <div class="controls">
            <button id="btnStart" class="primary" onclick="startBroadcast()">▶️ بث</button>
            <button id="btnPause" onclick="togglePause()">⏸️ إيقاف مؤقت</button>
            <button onclick="resetSender()">🔄 إعادة</button>
        </div>
        <div class="status-badge" id="senderStatus">⏳ انتظر اختيار الملف</div>
    </div>
    <div id="panelReceiver" class="panel">
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="controls">
            <button id="btnCam" class="primary" onclick="startCamera()">📷 تشغيل الكاميرا</button>
            <button onclick="resetReceiver()">🧹 مسح</button>
        </div>
        <div class="progress-section">
            <div class="info-text"><span id="recvChunks">قطع مستلمة: 0</span><span id="recvStatus">⏳</span></div>
            <progress id="recvProgress" value="0" max="100"></progress>
        </div>
        <div class="log-box" id="logBox"><span>🟢 انتظر تشغيل الكاميرا...</span></div>
        <button class="btn-download hidden" id="btnDownload" onclick="downloadReceivedFile()">⬇️ تحميل الملف</button>
    </div>
</div>
<script>
// ======== دالة اختيار الملف (تدعم المتصفح و Capacitor رسمياً) ========
function pickFile() {
    // الحالة الأولى: متصفح عادي (كروم، فايرفوكس)
    if (!window.Capacitor || !window.Capacitor.isNative) {
        document.getElementById('fileInput').click();
        return;
    }

    // الحالة الثانية: تطبيق Capacitor الأصلي (APK)
    const { DocumentPicker } = Capacitor.Plugins;
    DocumentPicker.pick({ types: ['*/*'] })
        .then(result => {
            if (result.files && result.files.length > 0) {
                const file = result.files[0];
                // file.data هي الـ Base64 للملف، file.name هو اسمه
                const byteString = atob(file.data);
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ab], { type: file.mimeType || 'application/octet-stream' });
                const selectedFile = new File([blob], file.name, { type: file.mimeType || 'application/octet-stream' });
                // نمرر الملف لنفس دالة المعالجة القديمة
                handleFileSelect({ target: { files: [selectedFile] } });
            }
        })
        .catch(err => {
            console.log('ألغى المستخدم اختيار الملف', err);
        });
}

// دالة معالجة الملف المختار (من input العادي أو من Capacitor)
function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    STATE.file = file;
    document.getElementById('fileName').textContent = '📄 '+file.name+' ('+(file.size/1024).toFixed(1)+' كيلوبايت)';
    prepareFileForSending(file);
    document.getElementById('senderStatus').textContent = '✅ جاهز للبث';
}

// ربط الـ input العادي (للمتصفحات)
document.getElementById('fileInput').addEventListener('change', handleFileSelect);

// ======== باقي الكود (نفسه القديم، شغال 100%) ========
const STATE={file:null,chunks:[],totalChunks:0,currentIndex:0,isSending:false,isPaused:false,timer:null,receivedChunks:{},receivedCount:0,totalToReceive:0,fileMetadata:null};
function prepareFileForSending(file){const reader=new FileReader();reader.onload=function(ev){const rawData=new Uint8Array(ev.target.result);let base64=btoa(String.fromCharCode(...rawData));const meta=JSON.stringify({name:file.name,type:file.type,size:file.size});const CHUNK_SIZE=1800;const chunks=[];chunks.push(meta);for(let i=0;i<base64.length;i+=CHUNK_SIZE){chunks.push(base64.slice(i,i+CHUNK_SIZE));}
STATE.chunks=chunks;STATE.totalChunks=chunks.length;STATE.currentIndex=0;document.getElementById('chunkStatus').textContent='0 / '+STATE.totalChunks;document.getElementById('progressBar').max=STATE.totalChunks;document.getElementById('progressBar').value=0;document.getElementById('senderStatus').textContent='📦 '+STATE.totalChunks+' قطعة جاهزة';if(chunks.length>0)generateQR(chunks[0],0);};reader.readAsArrayBuffer(file);}
let qrInstance=null;
function generateQR(data,index){const container=document.getElementById('qrcode');container.innerHTML='';const payload=index+'|'+STATE.totalChunks+'|'+data;qrInstance=new QRCode(container,{text:payload,width:200,height:200,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}
function startBroadcast(){if(STATE.chunks.length===0){alert('اختار ملف أولاً!');return;}if(STATE.isSending&&!STATE.isPaused)return;if(STATE.isPaused){STATE.isPaused=false;document.getElementById('btnPause').textContent='⏸️ إيقاف مؤقت';document.getElementById('senderStatus').textContent='▶️ مستأنف...';sendNextChunk();return;}
STATE.isSending=true;STATE.currentIndex=0;document.getElementById('btnStart').disabled=true;document.getElementById('senderStatus').textContent='📡 جاري البث...';sendNextChunk();}
function sendNextChunk(){if(!STATE.isSending||STATE.isPaused)return;if(STATE.currentIndex>=STATE.totalChunks){STATE.isSending=false;document.getElementById('btnStart').disabled=false;document.getElementById('senderStatus').textContent='✅ تم البث بالكامل!';generateQR('انتهى',STATE.totalChunks);return;}
const idx=STATE.currentIndex;const chunkData=STATE.chunks[idx];generateQR(chunkData,idx);document.getElementById('chunkStatus').textContent=(idx+1)+' / '+STATE.totalChunks;document.getElementById('progressBar').value=idx+1;STATE.currentIndex++;let delay=350;if(STATE.totalChunks<50)delay=600;if(STATE.totalChunks>200)delay=200;STATE.timer=setTimeout(sendNextChunk,delay);}
function togglePause(){if(!STATE.isSending)return;STATE.isPaused=!STATE.isPaused;document.getElementById('btnPause').textContent=STATE.isPaused?'▶️ استئناف':'⏸️ إيقاف مؤقت';document.getElementById('senderStatus').textContent=STATE.isPaused?'⏸️ متوقف مؤقتاً':'▶️ جاري...';if(!STATE.isPaused){sendNextChunk();}else{clearTimeout(STATE.timer);}}
function resetSender(){clearTimeout(STATE.timer);STATE.isSending=false;STATE.isPaused=false;STATE.chunks=[];STATE.totalChunks=0;STATE.currentIndex=0;document.getElementById('btnStart').disabled=false;document.getElementById('btnPause').textContent='⏸️ إيقاف مؤقت';document.getElementById('qrcode').innerHTML='📱 QR سيظهر هنا';document.getElementById('chunkStatus').textContent='0 / 0';document.getElementById('progressBar').value=0;document.getElementById('senderStatus').textContent='🔄 تم التصفير';document.getElementById('fileName').textContent='📂 اضغط لاختيار ملف';document.getElementById('fileInput').value='';}
let video=document.getElementById('video');let canvas=document.getElementById('canvas');let ctx=canvas.getContext('2d');let scanInterval=null;let lastScanned=new Set();
async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:400,height:400}});video.srcObject=stream;await video.play();document.getElementById('btnCam').disabled=true;document.getElementById('btnCam').textContent='📷 تعمل...';addLog('🟢 الكاميرا شغالة');if(scanInterval)clearInterval(scanInterval);scanInterval=setInterval(scanQR,400);}catch(err){alert('مشكلة في الكاميرا: '+err.message);addLog('❌ فشل تشغيل الكاميرا');}}
function scanQR(){if(video.videoWidth===0)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(imageData.data,imageData.width,imageData.height,{inversionAttempts:"dontInvert",});if(code&&code.data){const text=code.data;if(lastScanned.has(text))return;lastScanned.add(text);const parts=text.split('|');if(parts.length===3){const idx=parseInt(parts[0]);const total=parseInt(parts[1]);const data=parts[2];if(!isNaN(idx)&&!isNaN(total)&&data){handleReceivedChunk(idx,total,data);}}else if(text==='انتهى'){addLog('🏁 نهاية البث');tryFinalize();}}}
function handleReceivedChunk(idx,total,data){if(STATE.receivedChunks[idx])return;STATE.receivedChunks[idx]=data;STATE.receivedCount=Object.keys(STATE.receivedChunks).length;STATE.totalToReceive=total;document.getElementById('recvChunks').textContent='قطع مستلمة: '+STATE.receivedCount+' / '+total;document.getElementById('recvProgress').value=(STATE.receivedCount/total)*100;addLog('✅ استلمت القطعة '+(idx+1)+'/'+total);if(STATE.receivedCount>=total){addLog('🎉 تم الاستلام!');tryFinalize();}}
function tryFinalize(){const total=STATE.totalToReceive;if(Object.keys(STATE.receivedChunks).length<total){addLog('⚠️ مستلم '+Object.keys(STATE.receivedChunks).length+' من '+total);return;}
let fullBase64='';for(let i=0;i<total;i++){if(!STATE.receivedChunks[i]){addLog('❌ القطعة '+i+' مفقودة');return;}
if(i===0){try{STATE.fileMetadata=JSON.parse(STATE.receivedChunks[i]);addLog('📄 اسم الملف: '+STATE.fileMetadata.name);}catch(e){addLog('⚠️ ميتاداتا غير صالحة');}}else{fullBase64+=STATE.receivedChunks[i];}}
try{const binaryString=atob(fullBase64);const bytes=new Uint8Array(binaryString.length);for(let i=0;i<binaryString.length;i++){bytes[i]=binaryString.charCodeAt(i);}
const blob=new Blob([bytes],{type:STATE.fileMetadata?.type||'application/octet-stream'});const url=URL.createObjectURL(blob);const downloadBtn=document.getElementById('btnDownload');downloadBtn.classList.remove('hidden');downloadBtn.onclick=function(){const a=document.createElement('a');a.href=url;a.download=STATE.fileMetadata?.name||'received_file';document.body.appendChild(a);a.click();document.body.removeChild(a);addLog('⬇️ تحميل');};addLog('✅ الملف جاهز! حجم: '+(blob.size/1024).toFixed(1)+' كيلوبايت');document.getElementById('recvStatus').textContent='✅ جاهز';}catch(e){addLog('❌ خطأ: '+e.message);}}
function addLog(msg){const box=document.getElementById('logBox');const span=document.createElement('span');span.textContent='🕒 '+new Date().toLocaleTimeString()+' - '+msg;box.appendChild(span);box.scrollTop=box.scrollHeight;}
function resetReceiver(){if(scanInterval)clearInterval(scanInterval);STATE.receivedChunks={};STATE.receivedCount=0;STATE.totalToReceive=0;STATE.fileMetadata=null;lastScanned=new Set();document.getElementById('recvChunks').textContent='قطع مستلمة: 0';document.getElementById('recvProgress').value=0;document.getElementById('recvStatus').textContent='⏳';document.getElementById('btnDownload').classList.add('hidden');document.getElementById('logBox').innerHTML='<span>🔄 تم المسح</span>';document.getElementById('btnCam').disabled=false;document.getElementById('btnCam').textContent='📷 تشغيل الكاميرا';if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;}}
function setMode(mode){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.mode-tabs button').forEach(b=>b.classList.remove('active'));if(mode==='sender'){document.getElementById('panelSender').classList.add('active');document.getElementById('tabSender').classList.add('active');if(scanInterval)clearInterval(scanInterval);}else{document.getElementById('panelReceiver').classList.add('active');document.getElementById('tabReceiver').classList.add('active');}}
function downloadReceivedFile(){}
console.log('🔥 الناقل البصري جاهز!');
addLog('💡 ضع جهازين جنب بعض');
</script>
</body>
</html>
