name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Prepare www directory and create manifest.json
      run: |
        mkdir -p www
        cp index.html www/
        cat > www/manifest.json << 'INNEREOF'
        {
          "name": "الناقل البصري",
          "short_name": "ناقل بصري",
          "description": "انقل الملفات بالضوء من غير نت",
          "start_url": "index.html",
          "display": "fullscreen",
          "orientation": "portrait",
          "background_color": "#0b0f19",
          "theme_color": "#0b0f19",
          "icons": [
            {
              "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E",
              "sizes": "192x192",
              "type": "image/svg+xml"
            }
          ]
        }
        INNEREOF

    - name: Create package.json
      run: npm init -y

    - name: Install Capacitor CLI and core
      run: npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

    - name: Initialize Capacitor
      run: npx cap init "الناقل البصري" "com.optical.transfer" --web-dir=www

    - name: Remove old Android folder if exists
      run: rm -rf android

    - name: Add Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Increase Gradle memory
      run: echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

    - name: Clean Gradle cache
      run: rm -rf ~/.gradle/caches/jars-9/

    - name: Build Release APK (unsigned)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

    - name: Sign APK with Debug Keystore
      run: |
        cd android/app/build/outputs/apk/release
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ~/.android/debug.keystore -storepass android -keypass android app-release-unsigned.apk androiddebugkey
        mv app-release-unsigned.apk optical-transfer.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: optical-transfer-apk
        path: android/app/build/outputs/apk/release/optical-transfer.apk
