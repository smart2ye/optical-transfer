name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare www directory and create manifest.json
      run: |
        mkdir -p www
        cp index.html www/
        cat > www/manifest.json << 'INNEREOF'
        {
          "name": "الناقل البصري",
          "short_name": "ناقل بصري",
          "description": "انقل الملفات بالضوء من غير نت",
          "start_url": "index.html",
          "display": "fullscreen",
          "orientation": "portrait",
          "background_color": "#0b0f19",
          "theme_color": "#0b0f19",
          "icons": [
            {
              "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E",
              "sizes": "192x192",
              "type": "image/svg+xml"
            }
          ]
        }
        INNEREOF

    - name: Create package.json
      run: npm init -y

    - name: Install Capacitor (only official)
      run: npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest --legacy-peer-deps

    - name: Initialize Capacitor
      run: npx cap init "الناقل البصري" "com.optical.transfer" --web-dir=www

    - name: Remove old Android folder if exists
      run: rm -rf android

    - name: Add Android platform
      run: npx cap add android

    - name: Overwrite AndroidManifest.xml with correct permissions
      run: |
        cat > android/app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.optical.transfer">

            <!-- الأذونات المطلوبة -->
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

            <!-- دعم الكاميرا -->
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/AppTheme"
                android:requestLegacyExternalStorage="true"
                android:usesCleartextTraffic="true">

                <activity
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                    android:name="com.getcapacitor.MainActivity"
                    android:label="@string/app_name"
                    android:theme="@style/AppTheme.NoActionBar"
                    android:launchMode="singleTask"
                    android:exported="true">

                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>

                    <intent-filter>
                        <action android:name="android.intent.action.VIEW" />
                        <category android:name="android.intent.category.DEFAULT" />
                        <category android:name="android.intent.category.BROWSABLE" />
                        <data android:scheme="@string/custom_url_scheme" />
                    </intent-filter>

                </activity>

                <!-- FileProvider لدعم اختيار الملفات في Android 11+ -->
                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

            </application>

        </manifest>
        MANIFESTEOF

    - name: Create file_paths.xml for FileProvider
      run: |
        mkdir -p android/app/src/main/res/xml
        cat > android/app/src/main/res/xml/file_paths.xml << 'FPEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-path name="external_files" path="." />
            <cache-path name="cache_files" path="." />
            <files-path name="files" path="." />
        </paths>
        FPEOF

    - name: Upgrade Gradle to version 8.7
      run: |
        sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

    - name: Set compileSdk and targetSdk to 35 and minSdk to 23
      run: |
        sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 35/g' android/app/build.gradle
        sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 35/g' android/app/build.gradle
        sed -i '/defaultConfig {/a \ \ \ \ \ \ \ \ minSdkVersion 23' android/app/build.gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Increase Gradle memory
      run: echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

    - name: Clean FULL Gradle cache
      run: rm -rf ~/.gradle/caches/

    - name: Build Release APK (unsigned)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

    - name: Install Android SDK build-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-build-tools

    - name: Sign APK with apksigner (V1 + V2)
      run: |
        cd android/app/build/outputs/apk/release
        cp app-release-unsigned.apk app-unsigned.apk
        APKSIGNER=$(find /usr -name "apksigner" 2>/dev/null | head -n 1)
        if [ -z "$APKSIGNER" ]; then
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ~/.android/debug.keystore -storepass android -keypass android app-unsigned.apk androiddebugkey
          mv app-unsigned.apk optical-transfer.apk
        else
          $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out optical-transfer.apk app-unsigned.apk
        fi

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: optical-transfer-apk
        path: android/app/build/outputs/apk/release/optical-transfer.apk
